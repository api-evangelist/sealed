aid: sealed
name: Sealed
description: 'Sealed is a New York-based climate technology company, founded in 2012,
  whose Sealed Pro platform helps home-improvement contractors sell and finance home
  weatherization and electrification projects — insulation, air sealing, heat pumps,
  smart thermostats and heat-pump water heaters. Sealed pairs energy data and analytics
  with a rebate and incentive engine that qualifies a project at the point of sale,
  guarantees a minimum rebate amount, files the utility and Inflation Reduction Act
  (HOMES / HEAR) paperwork on the contractor''s behalf, and pays the contractor after
  installation while Sealed carries the incentive-collection risk. The company began
  as a direct-to-consumer home energy retrofit provider with the first residential
  energy-savings guarantee, and relaunched as Sealed Pro, a contractor-facing software
  platform, working with utilities and state energy offices on measured- and
  modeled-savings programs.'
